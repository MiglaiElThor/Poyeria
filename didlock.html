<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deadlock Hero Release Countdown</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0f19;
            color: #f8fafc;
            padding: 0 2rem;
        }
        .page-wrapper {
            display: flex;
            align-items: stretch;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
        }
        .side-container {
            flex: 1;
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            min-width: 200px;
            overflow: hidden;
        }
        .sinclair-header {
            padding: 1.5rem 1rem;
            text-align: center;
            background: #111827;
            border-bottom: 1px solid #1f2937;
        }
        .sinclair-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 0.5rem;
        }
        .sinclair-counter {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ef4444;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }
        .image-box {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111827;
        }
        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .placeholder-text {
            color: #6b7280;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2rem 1rem;
            text-align: center;
        }
        .timer-container {
            flex: 2;
            text-align: center;
            background: #111827;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            margin-top: 0;
        }
        h2 {
            font-size: 2rem;
            color: #f59e0b;
            margin-top: 0;
            margin-bottom: 2rem;
        }
        .countdown {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        .time-box {
            background: #1f2937;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            min-width: 80px;
        }
        .number {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #38bdf8;
        }
        .label {
            font-size: 0.875rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-top: 0.25rem;
        }
        @media (max-width: 768px) {
            .page-wrapper {
                flex-direction: column;
            }
            .side-container {
                height: auto;
            }
            .image-box {
                height: 200px;
            }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <!-- Contenedor Izquierdo (Solo Imagen) -->
    <div class="side-container">
        <div class="image-box">
            <img src="abram.jpg" alt="Left Feature Image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="placeholder-text" style="display: none;">Left Image Placeholder</div>
        </div>
    </div>

    <!-- Contenedor Central (Countdown del Héroe) -->
    <div class="timer-container">
        <h1>Deadlock: City Never Sleeps</h1>
        <h2>Next Hero Release Countdown</h2>
        
        <div class="countdown">
            <div class="time-box">
                <div class="number" id="days">00</div>
                <div class="label">Days</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">00</div>
                <div class="label">Hours</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">00</div>
                <div class="label">Mins</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">00</div>
                <div class="label">Secs</div>
            </div>
        </div>
    </div>

    <!-- Contenedor Derecho (Contador ARRIBA de la Imagen) -->
    <div class="side-container">
        <div class="sinclair-header">
            <div class="sinclair-title">Time since last sinclair update:</div>
            <div class="sinclair-counter" id="sinclairDays">546 Days</div>
        </div>
        <div class="image-box">
            <img src="sinclair.jpg" alt="Right Feature Image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div class="placeholder-text" style="display: none;">Right Image Placeholder</div>
        </div>
    </div>
</div>

<script>
    // Target Release: October 2, 2026, 14:00:00 Pacific Time (21:00 UTC)
    const targetDate = new Date(Date.UTC(2026, 9, 2, 21, 0, 0)).getTime();

    // Historic Anchor Date: Set exactly 546 days prior to October 2, 2026
    const sinclairDate = new Date(Date.UTC(2025, 3, 4, 21, 0, 0)).getTime();

    function updateCounters() {
        const now = new Date().getTime();

        // 1. Central Hero Release Countdown
        const differenceRelease = targetDate - now;
        if (differenceRelease <= 0) {
            document.querySelector(".countdown").innerHTML = "<div class='number' style='font-size: 2.5rem; color: #10b981;'>Hero Unlocked! Check In-Game</div>";
        } else {
            const days = Math.floor(differenceRelease / (1000 * 60 * 60 * 24));
            const hours = Math.floor((differenceRelease % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((differenceRelease % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((differenceRelease % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = days.toString().padStart(2, '0');
            document.getElementById("hours").textContent = hours.toString().padStart(2, '0');
            document.getElementById("minutes").textContent = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").textContent = seconds.toString().padStart(2, '0');
        }

        // 2. Right Box Time Elapsed Counter (Sinclair)
        const differenceSinclair = now - sinclairDate;
        if (differenceSinclair > 0) {
            const sDays = Math.floor(differenceSinclair / (1000 * 60 * 60 * 24));
            const daysEl = document.getElementById("sinclairDays");
            if (daysEl) daysEl.textContent = `${sDays} Days`;
        }
    }

    updateCounters();
    const interval = setInterval(updateCounters, 1000);
</script>

</body>
</html>
